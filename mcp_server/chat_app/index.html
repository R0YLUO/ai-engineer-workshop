<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Finance Team Chat</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f3f2f1; color: #242424; }
    header { background: #464775; color: white; padding: 14px 20px; font-weight: 600; }
    header small { font-weight: 400; opacity: 0.8; margin-left: 8px; }
    #messages { max-width: 860px; margin: 0 auto; padding: 20px; }
    .message { background: white; border-radius: 6px; padding: 12px 16px; margin-bottom: 12px;
               box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
    .meta { font-size: 13px; color: #616161; margin-bottom: 6px; }
    .meta strong { color: #464775; }
    .text { white-space: pre-wrap; line-height: 1.45; }
    .empty { text-align: center; color: #616161; margin-top: 60px; }
  </style>
</head>
<body>
  <header>#finance-disputes <small>Agent findings awaiting human review</small></header>
  <div id="messages"><p class="empty">No messages yet. Run the agent to see it post here.</p></div>
  <script src="app.js"></script>
</body>
</html>
